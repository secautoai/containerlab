! Lab 05 baseline - r4 (OSPF-only "datacenter/internet" router)
! Lo100 (198.51.100.0/24) is deliberately NOT advertised into OSPF:
! it simulates an internet destination reached only via default routes (task 8).
interface Loopback0
 description router-id
 ip address 10.255.255.4 255.255.255.255
!
interface Loopback1
 description DC LAN A
 ip address 192.168.41.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback2
 description DC LAN B
 ip address 192.168.42.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback100
 description simulated internet host (outside the IGPs)
 ip address 198.51.100.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/2 (OSPF)
 ip address 10.0.24.4 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/2 (OSPF)
 ip address 10.0.34.4 255.255.255.0
!
router ospf 1
 router-id 10.255.255.4
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.24.0 0.0.0.255 area 0
 network 10.0.34.0 0.0.0.255 area 0
 network 10.255.255.4 0.0.0.0 area 0
 network 192.168.41.0 0.0.0.255 area 0
 network 192.168.42.0 0.0.0.255 area 0
!
