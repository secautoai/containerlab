! Lab 05 baseline - r3 (border router: EIGRP towards r1, OSPF towards r4)
interface Loopback0
 description router-id (not advertised)
 ip address 10.255.255.3 255.255.255.255
!
interface Ethernet0/1
 description to r1 e0/2 (EIGRP)
 ip address 10.0.13.3 255.255.255.0
!
interface Ethernet0/2
 description to r4 e0/2 (OSPF)
 ip address 10.0.34.3 255.255.255.0
!
router eigrp 100
 eigrp router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.0.13.0 0.0.0.255
!
router ospf 1
 router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.0.34.0 0.0.0.255 area 0
!
ip route 0.0.0.0 0.0.0.0 10.0.34.4
!
