! Lab 05 SOLUTION - r1 (EIGRP site router + PBR + SLA-tracked defaults)
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Loopback1
 description site LAN A
 ip address 172.16.1.1 255.255.255.0
!
interface Loopback2
 description site LAN B
 ip address 172.16.2.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/1 (EIGRP)
 ip address 10.0.12.1 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/1 (EIGRP)
 ip address 10.0.13.1 255.255.255.0
!
! task 3: redistribute ONLY the intended external - never unscoped. Without the
! route-map, the SLA-tracked defaults from task 8 would leak into EIGRP too and
! bounce default-bound traffic between the borders and r4.
ip prefix-list PL-STATIC-EXT seq 5 permit 10.99.99.0/24
!
route-map RM-STATIC-TO-EIGRP permit 10
 match ip address prefix-list PL-STATIC-EXT
!
router eigrp 100
 eigrp router-id 10.255.255.1
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.255
 network 10.0.13.0 0.0.0.255
 network 10.255.255.1 0.0.0.0
 network 172.16.0.0
 redistribute static metric 10000 100 255 1 1500 route-map RM-STATIC-TO-EIGRP
!
! task 3: an "external" prefix that exposes the AD problem at the borders
ip route 10.99.99.0 255.255.255.0 Null0
!
! task 7: policy routing - LAN A traffic to the DC must use the r3 path
ip access-list extended ACL-LAN-A-TO-DC
 permit ip 172.16.1.0 0.0.0.255 192.168.0.0 0.0.255.255
!
route-map RM-PBR permit 10
 match ip address ACL-LAN-A-TO-DC
 set ip next-hop 10.0.13.3
!
route-map RM-PBR permit 20
!
ip local policy route-map RM-PBR
!
! task 8: SLA-tracked primary default via r2, floating static via r3
ip sla 1
 icmp-echo 10.0.24.4 source-interface Ethernet0/1
 frequency 5
ip sla schedule 1 life forever start-time now
!
track 1 ip sla 1 reachability
 delay down 5 up 10
!
ip route 0.0.0.0 0.0.0.0 10.0.12.2 track 1
ip route 0.0.0.0 0.0.0.0 10.0.13.3 250
!
