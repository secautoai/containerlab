! Lab 05 SOLUTION - r2 (border: mutual redistribution with tag-based loop
! prevention, prefix filtering, and external-AD tuning)
interface Loopback0
 description router-id (not advertised)
 ip address 10.255.255.2 255.255.255.255
!
interface Ethernet0/1
 description to r1 e0/1 (EIGRP)
 ip address 10.0.12.2 255.255.255.0
!
interface Ethernet0/2
 description to r4 e0/1 (OSPF)
 ip address 10.0.24.2 255.255.255.0
!
ip prefix-list PL-NO-LAN-B seq 5 permit 172.16.2.0/24
!
! deny what the OTHER protocol already tagged; tag what we inject
route-map RM-EIGRP-TO-OSPF deny 4
 description keep site LAN B private to the EIGRP domain
 match ip address prefix-list PL-NO-LAN-B
!
route-map RM-EIGRP-TO-OSPF deny 5
 match tag 110
!
route-map RM-EIGRP-TO-OSPF permit 10
 set tag 90
!
route-map RM-OSPF-TO-EIGRP deny 5
 match tag 90
!
route-map RM-OSPF-TO-EIGRP permit 10
 set tag 110
!
router eigrp 100
 eigrp router-id 10.255.255.2
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.0.12.0 0.0.0.255
 redistribute ospf 1 metric 10000 100 255 1 1500 route-map RM-OSPF-TO-EIGRP
!
router ospf 1
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.0.24.0 0.0.0.255 area 0
 redistribute eigrp 100 subnets route-map RM-EIGRP-TO-OSPF
 distance ospf external 180
!
ip route 0.0.0.0 0.0.0.0 10.0.24.4
!
