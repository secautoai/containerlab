! Lab 06 SOLUTION - r2 (standby gateway: HSRP, PAT, NTP client, syslog)
interface Ethernet0/1
 description LAN (via sw1)
 ip address 10.1.10.3 255.255.255.0
 ip nat inside
 standby version 2
 standby 10 ip 10.1.10.1
 standby 10 preempt
!
interface Ethernet0/2
 description WAN uplink to ISP r3
 ip address 203.0.113.5 255.255.255.252
 ip nat outside
!
ip route 0.0.0.0 0.0.0.0 203.0.113.6
!
ip access-list standard ACL-NAT-INSIDE
 permit 10.1.10.0 0.0.0.255
!
ip nat inside source list ACL-NAT-INSIDE interface Ethernet0/2 overload
!
ntp server 203.0.113.6
!
service timestamps log datetime msec
logging host 10.1.10.11
logging trap informational
!
