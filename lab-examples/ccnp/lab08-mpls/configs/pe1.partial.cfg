! Lab 08 baseline - pe1 (provider edge 1)
! NOTE: e0/1 (towards ce1) has NO ip address on purpose - it moves into the
! customer VRF in task 3, which is when you address it (192.168.10.1/30).
interface Loopback0
 description router-id / LDP / BGP peering
 ip address 10.255.255.1 255.255.255.255
!
interface Ethernet0/1
 description to ce1 e0/1 (PE-CE link - goes into VRF CUST-A)
!
interface Ethernet0/2
 description to p1 e0/1 (core)
 ip address 10.0.0.1 255.255.255.252
!
