! Lab 08 baseline - pe2 (provider edge 2)
! NOTE: e0/2 (towards ce2) has NO ip address on purpose - it moves into the
! customer VRF in task 3, which is when you address it (192.168.20.1/30).
interface Loopback0
 description router-id / LDP / BGP peering
 ip address 10.255.255.3 255.255.255.255
!
interface Ethernet0/1
 description to p1 e0/2 (core)
 ip address 10.0.0.6 255.255.255.252
!
interface Ethernet0/2
 description to ce2 e0/1 (PE-CE link - goes into VRF CUST-A)
!
