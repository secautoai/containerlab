! Lab 08 SOLUTION - pe2 (provider edge 2)
vrf definition CUST-A
 rd 65000:10
 !
 address-family ipv4
  route-target export 65000:10
  route-target import 65000:10
 exit-address-family
!
interface Loopback0
 description router-id / LDP / BGP peering
 ip address 10.255.255.3 255.255.255.255
!
interface Ethernet0/1
 description to p1 e0/2 (core)
 ip address 10.0.0.6 255.255.255.252
 mpls ip
!
interface Ethernet0/2
 description to ce2 e0/1 (PE-CE link in VRF CUST-A)
 vrf forwarding CUST-A
 ip address 192.168.20.1 255.255.255.252
!
mpls ldp router-id Loopback0 force
!
router ospf 1
 router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.0.0.4 0.0.0.3 area 0
 network 10.255.255.3 0.0.0.0 area 0
!
router bgp 65000
 bgp router-id 10.255.255.3
 bgp log-neighbor-changes
 neighbor 10.255.255.1 remote-as 65000
 neighbor 10.255.255.1 description iBGP to pe1 (VPNv4)
 neighbor 10.255.255.1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.255.1 activate
  neighbor 10.255.255.1 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST-A
  neighbor 192.168.20.2 remote-as 65020
  neighbor 192.168.20.2 description customer ce2
  neighbor 192.168.20.2 activate
 exit-address-family
!
