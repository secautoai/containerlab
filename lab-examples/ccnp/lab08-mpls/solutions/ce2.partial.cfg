! Lab 08 SOLUTION - ce2 (customer site 2, AS 65020)
interface Loopback1
 description site 2 LAN
 ip address 172.16.20.1 255.255.255.0
!
interface Ethernet0/1
 description to pe2 e0/2 (PE-CE link)
 ip address 192.168.20.2 255.255.255.252
!
router bgp 65020
 bgp router-id 172.16.20.1
 bgp log-neighbor-changes
 network 172.16.20.0 mask 255.255.255.0
 neighbor 192.168.20.1 remote-as 65000
 neighbor 192.168.20.1 description provider pe2
!
