! Lab 08 SOLUTION - pe1 (provider edge 1)
vrf definition CUST-A
 rd 65000:10
 !
 address-family ipv4
  route-target export 65000:10
  route-target import 65000:10
 exit-address-family
!
interface Loopback0
 description router-id / LDP / BGP peering
 ip address 10.255.255.1 255.255.255.255
!
interface Ethernet0/1
 description to ce1 e0/1 (PE-CE link in VRF CUST-A)
 vrf forwarding CUST-A
 ip address 192.168.10.1 255.255.255.252
!
interface Ethernet0/2
 description to p1 e0/1 (core)
 ip address 10.0.0.1 255.255.255.252
 mpls ip
!
mpls ldp router-id Loopback0 force
!
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.0.0.0 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
router bgp 65000
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 neighbor 10.255.255.3 remote-as 65000
 neighbor 10.255.255.3 description iBGP to pe2 (VPNv4)
 neighbor 10.255.255.3 update-source Loopback0
 !
 address-family vpnv4
  neighbor 10.255.255.3 activate
  neighbor 10.255.255.3 send-community extended
 exit-address-family
 !
 address-family ipv4 vrf CUST-A
  neighbor 192.168.10.2 remote-as 65010
  neighbor 192.168.10.2 description customer ce1
  neighbor 192.168.10.2 activate
 exit-address-family
!
