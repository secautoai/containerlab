! Lab 08 SOLUTION - ce1 (customer site 1, AS 65010)
interface Loopback1
 description site 1 LAN
 ip address 172.16.10.1 255.255.255.0
!
interface Ethernet0/1
 description to pe1 e0/1 (PE-CE link)
 ip address 192.168.10.2 255.255.255.252
!
router bgp 65010
 bgp router-id 172.16.10.1
 bgp log-neighbor-changes
 network 172.16.10.0 mask 255.255.255.0
 neighbor 192.168.10.1 remote-as 65000
 neighbor 192.168.10.1 description provider pe1
!
