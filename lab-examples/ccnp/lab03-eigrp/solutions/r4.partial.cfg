! Lab 03 SOLUTION - r4 (datacenter, summarizes 172.16.4.0/22 towards both uplinks)
interface Loopback0
 description router-id
 ip address 10.255.255.4 255.255.255.255
!
interface Loopback1
 description DC LAN A
 ip address 172.16.4.1 255.255.255.0
!
interface Loopback2
 description DC LAN B
 ip address 172.16.5.1 255.255.255.0
!
interface Loopback3
 description DC LAN C
 ip address 172.16.6.1 255.255.255.0
!
interface Loopback4
 description DC LAN D
 ip address 172.16.7.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/2
 ip address 10.0.24.4 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/2
 ip address 10.0.34.4 255.255.255.0
!
router eigrp CCNP
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   summary-address 172.16.4.0 255.255.252.0
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   summary-address 172.16.4.0 255.255.252.0
   no passive-interface
  exit-af-interface
  !
  topology base
  exit-af-topology
  network 10.0.24.0 0.0.0.255
  network 10.0.34.0 0.0.0.255
  network 10.255.255.4 0.0.0.0
  network 172.16.4.0 0.0.3.255
  eigrp router-id 10.255.255.4
 exit-address-family
!
