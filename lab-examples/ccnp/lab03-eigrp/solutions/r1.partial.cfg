! Lab 03 SOLUTION - r1 (named mode, variance 2, SHA auth towards r2)
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Ethernet0/1
 description to r2 e0/1 (fast path)
 ip address 10.0.12.1 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/1 (slow path - delay raised to simulate WAN)
 ip address 10.0.13.1 255.255.255.0
 delay 200
!
router eigrp CCNP
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   authentication mode hmac-sha-256 0 CCNPeigrp
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   no passive-interface
  exit-af-interface
  !
  topology base
   variance 2
  exit-af-topology
  network 10.0.12.0 0.0.0.255
  network 10.0.13.0 0.0.0.255
  network 10.255.255.1 0.0.0.0
  eigrp router-id 10.255.255.1
 exit-address-family
!
