! Lab 03 SOLUTION - r3 (transit on the slow path)
! NOTE: task 6 temporarily configures "eigrp stub connected summary" here to show
! how a stub suppresses transit. The final state leaves stub OFF so that r3 keeps
! offering the feasible-successor path used by variance on r1.
interface Loopback0
 description router-id
 ip address 10.255.255.3 255.255.255.255
!
interface Ethernet0/1
 description to r1 e0/1 (slow path - delay raised to simulate WAN)
 ip address 10.0.13.3 255.255.255.0
 delay 200
!
interface Ethernet0/2
 description to r4 e0/2
 ip address 10.0.34.3 255.255.255.0
!
router eigrp CCNP
 !
 address-family ipv4 unicast autonomous-system 100
  !
  af-interface default
   passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/1
   no passive-interface
  exit-af-interface
  !
  af-interface Ethernet0/2
   no passive-interface
  exit-af-interface
  !
  topology base
  exit-af-topology
  network 10.0.13.0 0.0.0.255
  network 10.0.34.0 0.0.0.255
  network 10.255.255.3 0.0.0.0
  eigrp router-id 10.255.255.3
 exit-address-family
!
