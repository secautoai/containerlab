# Lab 03 - EIGRP named mode: DUAL, variance, summarization, stub, authentication
#
#        r2
#       /  \          r1-r2-r4 : fast path (successor)
#     r1    r4        r1-r3-r4 : slow path (higher delay - feasible successor)
#       \  /
#        r3
name: ccnp-lab03

topology:
  kinds:
    cisco_iol:
      image: ${CCNP_IOL_IMAGE:=vrnetlab/cisco_iol:17.12.01}

  nodes:
    r1:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r1.partial.cfg
    r2:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r2.partial.cfg
    r3:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r3.partial.cfg
    r4:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r4.partial.cfg

  links:
    - endpoints: ["r1:Ethernet0/1", "r2:Ethernet0/1"]  # 10.0.12.0/24
    - endpoints: ["r1:Ethernet0/2", "r3:Ethernet0/1"]  # 10.0.13.0/24 (high delay)
    - endpoints: ["r2:Ethernet0/2", "r4:Ethernet0/1"]  # 10.0.24.0/24
    - endpoints: ["r3:Ethernet0/2", "r4:Ethernet0/2"]  # 10.0.34.0/24
