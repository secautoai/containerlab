# Lab 02 - Multi-area OSPF
#
#   r1 ------- r2 ------- r3 ------- r4
#      area 1     area 0     area 2
#   (tot.stub)  (backbone)   (NSSA)
name: ccnp-lab02

topology:
  kinds:
    cisco_iol:
      image: ${CCNP_IOL_IMAGE:=vrnetlab/cisco_iol:17.12.01}

  nodes:
    r1:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r1.partial.cfg
    r2:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r2.partial.cfg
    r3:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r3.partial.cfg
    r4:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r4.partial.cfg

  links:
    - endpoints: ["r1:Ethernet0/1", "r2:Ethernet0/1"]  # 10.0.12.0/24  area 1
    - endpoints: ["r2:Ethernet0/2", "r3:Ethernet0/1"]  # 10.0.23.0/24  area 0
    - endpoints: ["r3:Ethernet0/2", "r4:Ethernet0/1"]  # 10.0.34.0/24  area 2
