! Lab 02 SOLUTION - r3 (ABR area 0/2, NSSA ABR + translator, ASBR for 203.0.113.0/24,
! originates the domain default route)
key chain OSPF-KEYS
 key 1
  key-string CCNPospf
  cryptographic-algorithm hmac-sha-256
!
interface Loopback0
 description router-id
 ip address 10.255.255.3 255.255.255.255
!
interface Loopback100
 description simulated external network (redistributed)
 ip address 203.0.113.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/2 (area 0) - authenticated
 ip address 10.0.23.3 255.255.255.0
 ip ospf authentication key-chain OSPF-KEYS
!
interface Ethernet0/2
 description to r4 e0/1 (area 2)
 ip address 10.0.34.3 255.255.255.0
!
route-map RM-EXTERNAL permit 10
 match interface Loopback100
!
router ospf 1
 router-id 10.255.255.3
 auto-cost reference-bandwidth 10000
 area 2 nssa default-information-originate
 redistribute connected subnets route-map RM-EXTERNAL
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.23.0 0.0.0.255 area 0
 network 10.0.34.0 0.0.0.255 area 2
 network 10.255.255.3 0.0.0.0 area 0
 default-information originate
!
ip route 0.0.0.0 0.0.0.0 Null0 250
!
