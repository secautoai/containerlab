! Lab 02 SOLUTION - r2 (ABR area 1/0, totally stubby ABR, summarizes area 1)
key chain OSPF-KEYS
 key 1
  key-string CCNPospf
  cryptographic-algorithm hmac-sha-256
!
interface Loopback0
 description router-id
 ip address 10.255.255.2 255.255.255.255
!
interface Ethernet0/1
 description to r1 e0/1 (area 1)
 ip address 10.0.12.2 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/2
 description to r3 e0/1 (area 0) - authenticated
 ip address 10.0.23.2 255.255.255.0
 ip ospf authentication key-chain OSPF-KEYS
!
router ospf 1
 router-id 10.255.255.2
 auto-cost reference-bandwidth 10000
 area 1 stub no-summary
 area 1 range 172.16.0.0 255.255.252.0
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.255 area 1
 network 10.0.23.0 0.0.0.255 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
