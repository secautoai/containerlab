! Lab 02 SOLUTION - r4 (NSSA internal ASBR, interface-style OSPF activation)
interface Loopback0
 description router-id
 ip address 10.255.255.4 255.255.255.255
 ip ospf 1 area 2
!
interface Loopback1
 description legacy site network (redistributed as N2)
 ip address 192.168.44.1 255.255.255.0
!
interface Loopback2
 description area 2 internal LAN
 ip address 172.31.4.1 255.255.255.0
 ip ospf 1 area 2
!
interface Ethernet0/1
 description to r3 e0/2 (area 2)
 ip address 10.0.34.4 255.255.255.0
 ip ospf 1 area 2
!
route-map RM-LEGACY permit 10
 match interface Loopback1
!
router ospf 1
 router-id 10.255.255.4
 auto-cost reference-bandwidth 10000
 area 2 nssa
 redistribute connected subnets route-map RM-LEGACY
 passive-interface default
 no passive-interface Ethernet0/1
!
