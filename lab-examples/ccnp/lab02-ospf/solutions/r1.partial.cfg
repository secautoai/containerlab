! Lab 02 SOLUTION - r1 (internal router, totally stubby area 1)
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Loopback1
 description branch LAN A (area 1)
 ip address 172.16.0.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback2
 description branch LAN B (area 1)
 ip address 172.16.1.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback3
 description branch LAN C (area 1)
 ip address 172.16.2.1 255.255.255.0
 ip ospf network point-to-point
!
interface Loopback4
 description branch LAN D (area 1)
 ip address 172.16.3.1 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/1
 description to r2 e0/1 (area 1)
 ip address 10.0.12.1 255.255.255.0
 ip ospf network point-to-point
!
router ospf 1
 router-id 10.255.255.1
 auto-cost reference-bandwidth 10000
 area 1 stub
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.0.12.0 0.0.0.255 area 1
 network 10.255.255.1 0.0.0.0 area 1
 network 172.16.0.0 0.0.3.255 area 1
!
