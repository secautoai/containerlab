# Lab 10 - Automation & programmability: NETCONF/YANG, RESTCONF, JSON, EEM
#
#   r1 ----------- r2      (OSPF pre-provisioned; you enable the APIs and
#     10.10.12.0/30         drive both routers from Python - see scripts/)
name: ccnp-lab10

topology:
  kinds:
    cisco_iol:
      image: ${CCNP_IOL_IMAGE:=vrnetlab/cisco_iol:17.12.01}

  nodes:
    r1:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r1.partial.cfg
    r2:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r2.partial.cfg

  links:
    - endpoints: ["r1:Ethernet0/1", "r2:Ethernet0/1"]  # 10.10.12.0/30
