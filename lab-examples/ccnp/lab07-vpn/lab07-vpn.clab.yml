# Lab 07 - GRE, DMVPN (phase 1 -> 3) & IPsec
#
#                r1 (HQ hub)  Lo1 10.0.1.0/24
#                 | e0/1 100.64.1.0/30
#                 |
#                r4 ("internet" - underlay only, hands off)
#                / \
#  100.64.2.0/30/   \100.64.3.0/30
#              /     \
#   (branch) r2       r3 (branch)
#   Lo1 10.0.2.0/24   Lo1 10.0.3.0/24
#
#   Overlay: Tunnel100 172.16.100.0/24 (.1 hub, .2 r2, .3 r3)
name: ccnp-lab07

topology:
  kinds:
    cisco_iol:
      image: ${CCNP_IOL_IMAGE:=vrnetlab/cisco_iol:17.12.01}

  nodes:
    r1:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r1.partial.cfg
    r2:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r2.partial.cfg
    r3:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r3.partial.cfg
    r4:
      kind: cisco_iol
      startup-config: ${CCNP_CFG:=configs}/r4.partial.cfg

  links:
    - endpoints: ["r1:Ethernet0/1", "r4:Ethernet0/1"]  # 100.64.1.0/30
    - endpoints: ["r2:Ethernet0/1", "r4:Ethernet0/2"]  # 100.64.2.0/30
    - endpoints: ["r3:Ethernet0/1", "r4:Ethernet0/3"]  # 100.64.3.0/30
