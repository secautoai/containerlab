! Lab 07 SOLUTION - r1 (DMVPN phase 3 hub with IPsec protection)
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Loopback1
 description HQ LAN
 ip address 10.0.1.1 255.255.255.0
!
interface Ethernet0/1
 description WAN uplink ("internet" via r4)
 ip address 100.64.1.1 255.255.255.252
!
crypto isakmp policy 10
 encryption aes 256
 hash sha256
 authentication pre-share
 group 14
crypto isakmp key CCNP-DMVPN address 0.0.0.0
!
crypto ipsec transform-set TS-DMVPN esp-aes 256 esp-sha256-hmac
 mode transport
!
crypto ipsec profile PROF-DMVPN
 set transform-set TS-DMVPN
!
interface Tunnel100
 description DMVPN hub (mGRE)
 bandwidth 10000
 ip address 172.16.100.1 255.255.255.0
 no ip redirects
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip nhrp authentication CCNP7
 ip nhrp map multicast dynamic
 ip nhrp network-id 100
 ip nhrp redirect
 no ip split-horizon eigrp 100
 tunnel source Ethernet0/1
 tunnel mode gre multipoint
 tunnel key 100
 tunnel protection ipsec profile PROF-DMVPN
!
router eigrp 100
 eigrp router-id 10.255.255.1
 passive-interface default
 no passive-interface Tunnel100
 network 10.0.0.0
 network 172.16.100.0 0.0.0.255
!
ip route 0.0.0.0 0.0.0.0 100.64.1.2
!
