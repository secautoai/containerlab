! Lab 07 baseline - r4 = the "internet" (underlay only). FULLY CONFIGURED - hands off!
! r4 knows ONLY the three connected /30s - like the real internet, it has no idea
! about your 10.0.x.0/24 LANs. That is exactly why the overlay tunnels exist.
! Tip: this is the perfect vantage point for tcpdump - watch GRE turn into ESP.
interface Ethernet0/1
 description to hub r1
 ip address 100.64.1.2 255.255.255.252
!
interface Ethernet0/2
 description to spoke r2
 ip address 100.64.2.2 255.255.255.252
!
interface Ethernet0/3
 description to spoke r3
 ip address 100.64.3.2 255.255.255.252
!
