! Lab 04 SOLUTION - r2 (edge to ISP-A; primary exit via local-preference 200)
interface Loopback0
 description router-id / iBGP peering
 ip address 10.255.255.2 255.255.255.255
!
interface Loopback1
 description enterprise prefix (advertised into BGP)
 ip address 10.1.2.1 255.255.255.0
!
interface Ethernet0/1
 description to r1 e0/1
 ip address 10.0.12.2 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/2
 ip address 10.0.23.2 255.255.255.0
!
interface Ethernet0/3
 description to ISP-A r4 e0/1 (eBGP)
 ip address 100.64.24.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.255 area 0
 network 10.0.23.0 0.0.0.255 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
ip prefix-list PL-AGG-ONLY seq 5 permit 10.1.0.0/16
!
route-map RM-FROM-ISPA permit 10
 description primary exit - prefer routes learned from ISP-A
 set local-preference 200
!
router bgp 65001
 bgp router-id 10.255.255.2
 bgp log-neighbor-changes
 network 10.1.2.0 mask 255.255.255.0
 aggregate-address 10.1.0.0 255.255.0.0
 neighbor 10.255.255.1 remote-as 65001
 neighbor 10.255.255.1 description iBGP to RR r1
 neighbor 10.255.255.1 update-source Loopback0
 neighbor 10.255.255.1 next-hop-self
 neighbor 100.64.24.2 remote-as 65100
 neighbor 100.64.24.2 description eBGP to ISP-A r4
 neighbor 100.64.24.2 prefix-list PL-AGG-ONLY out
 neighbor 100.64.24.2 route-map RM-FROM-ISPA in
!
