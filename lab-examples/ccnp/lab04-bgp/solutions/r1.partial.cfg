! Lab 04 SOLUTION - r1 (route reflector for r2 and r3)
interface Loopback0
 description router-id / iBGP peering
 ip address 10.255.255.1 255.255.255.255
!
interface Loopback1
 description enterprise prefix (advertised into BGP)
 ip address 10.1.1.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/1
 ip address 10.0.12.1 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/1
 ip address 10.0.13.1 255.255.255.0
!
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.255 area 0
 network 10.0.13.0 0.0.0.255 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
router bgp 65001
 bgp router-id 10.255.255.1
 bgp log-neighbor-changes
 network 10.1.1.0 mask 255.255.255.0
 neighbor 10.255.255.2 remote-as 65001
 neighbor 10.255.255.2 description iBGP client r2
 neighbor 10.255.255.2 update-source Loopback0
 neighbor 10.255.255.2 route-reflector-client
 neighbor 10.255.255.3 remote-as 65001
 neighbor 10.255.255.3 description iBGP client r3
 neighbor 10.255.255.3 update-source Loopback0
 neighbor 10.255.255.3 route-reflector-client
!
