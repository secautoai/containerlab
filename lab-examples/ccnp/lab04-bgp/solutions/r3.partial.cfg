! Lab 04 SOLUTION - r3 (edge to ISP-B; de-preferred inbound via AS-path prepend)
interface Loopback0
 description router-id / iBGP peering
 ip address 10.255.255.3 255.255.255.255
!
interface Loopback1
 description enterprise prefix (advertised into BGP)
 ip address 10.1.3.1 255.255.255.0
!
interface Ethernet0/1
 description to r1 e0/2
 ip address 10.0.13.3 255.255.255.0
!
interface Ethernet0/2
 description to r2 e0/2
 ip address 10.0.23.3 255.255.255.0
!
interface Ethernet0/3
 description to ISP-B r5 e0/1 (eBGP)
 ip address 100.64.35.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.13.0 0.0.0.255 area 0
 network 10.0.23.0 0.0.0.255 area 0
 network 10.255.255.3 0.0.0.0 area 0
!
ip prefix-list PL-AGG-ONLY seq 5 permit 10.1.0.0/16
!
route-map RM-TO-ISPB permit 10
 description make this path longer so the internet prefers r2/ISP-A
 set as-path prepend 65001 65001 65001
!
router bgp 65001
 bgp router-id 10.255.255.3
 bgp log-neighbor-changes
 network 10.1.3.0 mask 255.255.255.0
 aggregate-address 10.1.0.0 255.255.0.0
 neighbor 10.255.255.1 remote-as 65001
 neighbor 10.255.255.1 description iBGP to RR r1
 neighbor 10.255.255.1 update-source Loopback0
 neighbor 10.255.255.1 next-hop-self
 neighbor 100.64.35.2 remote-as 65200
 neighbor 100.64.35.2 description eBGP to ISP-B r5
 neighbor 100.64.35.2 prefix-list PL-AGG-ONLY out
 neighbor 100.64.35.2 route-map RM-TO-ISPB out
!
