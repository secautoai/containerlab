! Lab 04 SOLUTION (unchanged from baseline) - r5 = ISP-B (AS 65200). FULLY CONFIGURED - hands off!
! Advertises its own 203.0.113.0/24 and the shared "internet" prefix 100.100.100.0/24.
interface Loopback1
 description ISP-B customer prefix
 ip address 203.0.113.1 255.255.255.0
!
interface Ethernet0/1
 description to r3 e0/3 (customer AS 65001)
 ip address 100.64.35.2 255.255.255.252
!
interface Ethernet0/2
 description to r4 e0/2 (peer ISP-A)
 ip address 100.64.45.2 255.255.255.252
!
ip route 100.100.100.0 255.255.255.0 Null0
!
router bgp 65200
 bgp router-id 203.0.113.1
 bgp log-neighbor-changes
 network 203.0.113.0 mask 255.255.255.0
 network 100.100.100.0 mask 255.255.255.0
 neighbor 100.64.35.1 remote-as 65001
 neighbor 100.64.35.1 description customer AS65001 (r3)
 neighbor 100.64.45.1 remote-as 65100
 neighbor 100.64.45.1 description peer ISP-A (r4)
!
