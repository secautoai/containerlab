! Lab 04 baseline - r4 = ISP-A (AS 65100). FULLY CONFIGURED - hands off!
! Advertises its own 198.51.100.0/24 and the shared "internet" prefix 100.100.100.0/24.
interface Loopback1
 description ISP-A customer prefix
 ip address 198.51.100.1 255.255.255.0
!
interface Ethernet0/1
 description to r2 e0/3 (customer AS 65001)
 ip address 100.64.24.2 255.255.255.252
!
interface Ethernet0/2
 description to r5 e0/2 (peer ISP-B)
 ip address 100.64.45.1 255.255.255.252
!
ip route 100.100.100.0 255.255.255.0 Null0
!
router bgp 65100
 bgp router-id 198.51.100.1
 bgp log-neighbor-changes
 network 198.51.100.0 mask 255.255.255.0
 network 100.100.100.0 mask 255.255.255.0
 neighbor 100.64.24.1 remote-as 65001
 neighbor 100.64.24.1 description customer AS65001 (r2)
 neighbor 100.64.45.2 remote-as 65200
 neighbor 100.64.45.2 description peer ISP-B (r5)
!
