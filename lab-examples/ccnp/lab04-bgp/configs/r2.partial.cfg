! Lab 04 baseline - r2 (edge towards ISP-A / AS 65100)
interface Loopback0
 description router-id / iBGP peering
 ip address 10.255.255.2 255.255.255.255
!
interface Loopback1
 description enterprise prefix (advertise into BGP)
 ip address 10.1.2.1 255.255.255.0
!
interface Ethernet0/1
 description to r1 e0/1
 ip address 10.0.12.2 255.255.255.0
!
interface Ethernet0/2
 description to r3 e0/2
 ip address 10.0.23.2 255.255.255.0
!
interface Ethernet0/3
 description to ISP-A r4 e0/1 (eBGP)
 ip address 100.64.24.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.2
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.255 area 0
 network 10.0.23.0 0.0.0.255 area 0
 network 10.255.255.2 0.0.0.0 area 0
!
