! Lab 04 baseline - r3 (edge towards ISP-B / AS 65200)
interface Loopback0
 description router-id / iBGP peering
 ip address 10.255.255.3 255.255.255.255
!
interface Loopback1
 description enterprise prefix (advertise into BGP)
 ip address 10.1.3.1 255.255.255.0
!
interface Ethernet0/1
 description to r1 e0/2
 ip address 10.0.13.3 255.255.255.0
!
interface Ethernet0/2
 description to r2 e0/2
 ip address 10.0.23.3 255.255.255.0
!
interface Ethernet0/3
 description to ISP-B r5 e0/1 (eBGP)
 ip address 100.64.35.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.13.0 0.0.0.255 area 0
 network 10.0.23.0 0.0.0.255 area 0
 network 10.255.255.3 0.0.0.0 area 0
!
