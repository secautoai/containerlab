! Lab 01 SOLUTION - sw1 (distribution, STP root for VLAN 10, backup for VLAN 20)
vtp mode transparent
!
vlan 10
 name USERS
!
vlan 20
 name SERVERS
!
vlan 99
 name NATIVE
!
spanning-tree mode rapid-pvst
spanning-tree vlan 10 priority 24576
spanning-tree vlan 20 priority 28672
!
ip routing
!
interface Port-channel1
 description LACP bundle to sw2
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
!
interface Ethernet0/1
 description to sw2 e0/1 (Po1 member)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface Ethernet0/2
 description to sw2 e0/2 (Po1 member)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
 channel-group 1 mode active
!
interface Ethernet0/3
 description to sw3 e0/1 (trunk)
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport mode trunk
 switchport nonegotiate
!
interface Vlan10
 description gateway for USERS
 ip address 10.1.10.1 255.255.255.0
 no shutdown
!
interface Vlan20
 description gateway for SERVERS
 ip address 10.1.20.1 255.255.255.0
 no shutdown
!
