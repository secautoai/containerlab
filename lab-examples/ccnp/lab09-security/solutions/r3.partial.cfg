! Lab 09 SOLUTION (unchanged from baseline) - r3 (services router: "server LAN" 10.9.3.0/24 = trusted mgmt)
! Runs a tiny HTTP server so ACL tests have a real TCP service to hit.
interface Loopback0
 description router-id
 ip address 10.255.255.3 255.255.255.255
!
interface Loopback1
 description server LAN / trusted management subnet
 ip address 10.9.3.1 255.255.255.0
 ip ospf network point-to-point
!
interface Ethernet0/1
 description to r2 e0/2
 ip address 10.9.23.2 255.255.255.252
!
router ospf 1
 router-id 10.255.255.3
 passive-interface default
 no passive-interface Ethernet0/1
 network 10.9.23.0 0.0.0.3 area 0
 network 10.9.3.0 0.0.0.255 area 0
 network 10.255.255.3 0.0.0.0 area 0
!
ip http server
!
