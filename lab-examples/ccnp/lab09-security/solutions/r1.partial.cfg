! Lab 09 SOLUTION - r1 (hardened edge: AAA, VTY control, OG-ACL edge filter, uRPF)
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Ethernet0/1
 description untrusted LAN (pc1)
 ip address 10.9.1.1 255.255.255.0
 ip access-group ACL-EDGE-IN in
 ip verify unicast source reachable-via rx
!
interface Ethernet0/2
 description to r2 e0/1
 ip address 10.9.12.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.9.1.0 0.0.0.255 area 0
 network 10.9.12.0 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
! ---- task 1: device hardening ----------------------------------------------
enable secret S3cure-Enable!
service password-encryption
!
banner motd ^
*** AUTHORIZED ACCESS ONLY - ccnp-lab09 r1 ***
^
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
!
! trusted sources for management: server LAN + containerlab mgmt net
! (the topology pins the clab mgmt subnet to 172.20.20.0/24 to match)
ip access-list standard ACL-MGMT
 permit 10.9.3.0 0.0.0.255
 permit 172.20.20.0 0.0.0.255
 deny   any log
!
! keep trusted sources able to log in during a block-for quiet period
login quiet-mode access-class ACL-MGMT
!
line vty 0 4
 access-class ACL-MGMT in vrf-also
 exec-timeout 10 0
 transport input ssh
!
! ---- task 2: local AAA ------------------------------------------------------
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username netadmin privilege 15 secret NetAdmin123!
!
! ---- tasks 3+4: edge ACL with object groups ---------------------------------
object-group network OG-CLIENTS
 10.9.1.0 255.255.255.0
!
object-group network OG-SERVERS
 10.9.3.0 255.255.255.0
!
object-group service OG-WEB-ICMP
 tcp eq www
 tcp eq 443
 icmp echo
!
ip access-list extended ACL-EDGE-IN
 permit object-group OG-WEB-ICMP object-group OG-CLIENTS object-group OG-SERVERS
 permit icmp 10.9.1.0 0.0.0.255 host 10.9.12.2 echo
 deny   ip any any log
!
! (the host 10.9.12.2 ACE exists solely for task 6's CoPP flood test)
!
