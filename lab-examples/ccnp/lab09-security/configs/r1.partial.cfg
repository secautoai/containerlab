! Lab 09 baseline - r1 (edge router facing the untrusted LAN)
! Routing is pre-provisioned; this lab is about SECURING the device and the edge.
interface Loopback0
 description router-id
 ip address 10.255.255.1 255.255.255.255
!
interface Ethernet0/1
 description untrusted LAN (pc1)
 ip address 10.9.1.1 255.255.255.0
!
interface Ethernet0/2
 description to r2 e0/1
 ip address 10.9.12.1 255.255.255.252
!
router ospf 1
 router-id 10.255.255.1
 passive-interface default
 no passive-interface Ethernet0/2
 network 10.9.1.0 0.0.0.255 area 0
 network 10.9.12.0 0.0.0.3 area 0
 network 10.255.255.1 0.0.0.0 area 0
!
